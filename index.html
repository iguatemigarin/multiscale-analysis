<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>web-viewer</title>
    </head>
    <body>
        <div class="controls" id="controlsPane">
            <fieldset>
                <label for="micInput">Mic</label>
                <select id="micInput">
                    <option value="">Select audio input...</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="midiInput">MIDI</label>
                <select id="midiInput">
                    <option value="">Select MIDI input...</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="viewMode">View</label>
                <select id="viewMode">
                    <option value="averages">Averages</option>
                    <option value="parentAvg" selected>Averages Delta (from parent)</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="visualScaleGrading">Scale Grading</label>
                <select id="visualScaleGrading">
                    <option value="mono">Monochromatic - Luminance</option>
                    <option value="color" selected>Color</option>
                </select>
            </fieldset>
            <fieldset>
                <label for="intensityMultiplier">Intensity</label>
                <input type="range" min="1" max="100" value="1" step="1" id="intensityMultiplier" />
                <label for="clamp">Clamp</label>
                <input type="range" min="0" max="1" value="0" step="0.0000001" id="clamp" />
            </fieldset>
        </div>
        <canvas id="canvas"></canvas>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
